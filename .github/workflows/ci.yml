# 依赖验证 CI：负责在 PR/push 上跑构建与测试，验证 dependabot 升级后的依赖
# 是否仍能编译通过。release.yml 只在打 tag 时触发，dependabot PR 走这里。

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '24'
  GO_VERSION: '1.26'

jobs:
  go-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend  # 本 job 全部命令都在 frontend 下
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (vite)
        run: npm run build

      - name: i18n check
        run: npm run i18n:check