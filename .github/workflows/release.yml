name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_VERSION: '24'

permissions:
  contents: write

jobs:
  # 先唯一创建 draft（含标题/说明），避免多 job 并行 softprops 竞态：
  # 无 body 的 job 先建空 draft 后，带 body 的副本会被当重复删掉
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          TITLE="Lumin SSH Client ${TAG}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          cat > "${NOTES_FILE}" <<EOF
          ## 更新日志
          - 改进文件管理器
          - 修复多 job 并行创建 Release 的竞态问题：新增 create-draft 独占 job 先建 draft
          - macOS/Windows 构建 job 依赖 create-draft，上传到已有 release
          - 安装 Node 24 时缓存依赖锁定 package-lock 路径
          - 统一下载链接引用步骤输出变量

          ## 产物下载
          - Linux 便携版 ([Lumin-V${VERSION}-linux-amd64](https://github.com/wmwlwmwl/Lumin-SSH/releases/download/v${VERSION}/Lumin-V${VERSION}-linux-amd64))：即下即用
          - Linux DEB 安装包 ([Lumin-V${VERSION}-amd64.deb](https://github.com/wmwlwmwl/Lumin-SSH/releases/download/v${VERSION}/Lumin-V${VERSION}-amd64.deb))：Debian/Ubuntu 安装包
          - Linux RPM 安装包 ([Lumin-V${VERSION}-amd64.rpm](https://github.com/wmwlwmwl/Lumin-SSH/releases/download/v${VERSION}/Lumin-V${VERSION}-amd64.rpm))：Red Hat/Fedora 安装包
          - macOS ARM 版 ([Lumin-V${VERSION}-arm64.dmg](https://github.com/wmwlwmwl/Lumin-SSH/releases/download/v${VERSION}/Lumin-V${VERSION}-arm64.dmg))：Apple Silicon (M1/M2/M3/M4)
          - macOS Intel 版 ([Lumin-V${VERSION}-amd64.dmg](https://github.com/wmwlwmwl/Lumin-SSH/releases/download/v${VERSION}/Lumin-V${VERSION}-amd64.dmg))：Intel 芯片
          - Windows 便携绿色版 ([Lumin-V${VERSION}-portable.exe](https://github.com/wmwlwmwl/Lumin-SSH/releases/download/v${VERSION}/Lumin-V${VERSION}-portable.exe))：内嵌 WebView2，即下即用
          - Windows 标准安装版 ([Lumin-V${VERSION}-amd64-installer.exe](https://github.com/wmwlwmwl/Lumin-SSH/releases/download/v${VERSION}/Lumin-V${VERSION}-amd64-installer.exe))：NSIS 安装包
          - 每个产物附带 .sha256 校验文件，自动更新时校验 SHA256 确保文件完整性
          - 本 Release **仅 Desktop**，Android 端见 [Lumin-SSH-Android](https://github.com/wmwlwmwl/Lumin-SSH-Android/releases)
          - 许可见仓库 [LICENSE](LICENSE)

          ## 安装/卸载方法
          ### DEB 包（Debian/Ubuntu）
          \`\`\`bash
          # 安装
          sudo dpkg -i Lumin-V${VERSION}-amd64.deb
          # 卸载
          sudo dpkg -r lumin
          \`\`\`

          ### RPM 包（Red Hat/Fedora）
          \`\`\`bash
          # 安装
          sudo rpm -ivh Lumin-V${VERSION}-amd64.rpm
          # 卸载
          sudo rpm -e lumin
          \`\`\`
          EOF
          # heredoc 用了缩进，去掉每行前导空格
          sed -i 's/^[[:space:]]*//' "${NOTES_FILE}"

          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --repo "${{ github.repository }}" \
              --draft=true \
              --title "${TITLE}" \
              --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG}" \
              --repo "${{ github.repository }}" \
              --draft \
              --title "${TITLE}" \
              --notes-file "${NOTES_FILE}"
          fi

  build-linux:
    needs: create-draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libglib2.0-dev \
            libc6-dev libayatana-appindicator3-dev \
            rpm alien fakeroot

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build Wails
        run: |
          export PATH=$HOME/go/bin:$PATH
          VERSION=${GITHUB_REF_NAME#v}
          wails build -clean -tags webkit2_41 -o Lumin
          cp build/bin/Lumin "build/Lumin-V${VERSION}-linux-amd64"
          shasum -a 256 "build/Lumin-V${VERSION}-linux-amd64" | sed 's|build/||' > "build/Lumin-V${VERSION}-linux-amd64.sha256"
          echo "binary=${{ github.workspace }}/build/Lumin-V${VERSION}-linux-amd64" >> $GITHUB_ENV
          echo "binary_sha=${{ github.workspace }}/build/Lumin-V${VERSION}-linux-amd64.sha256" >> $GITHUB_ENV

      - name: Package .deb & .rpm
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p build/deb/DEBIAN
          mkdir -p build/deb/usr/bin
          mkdir -p build/deb/usr/share/applications
          mkdir -p build/deb/usr/share/icons/hicolor/256x256/apps
          # 生成 control 文件
          { \
            echo "Package: lumin"; \
            echo "Version: ${VERSION}"; \
            echo "Section: net"; \
            echo "Priority: optional"; \
            echo "Architecture: amd64"; \
            echo "Depends: libgtk-3-0, libwebkit2gtk-4.1-0, libglib2.0-0, libc6, libayatana-appindicator3-1"; \
            echo "Maintainer: Lumin <admin@662662.xyz>"; \
            echo "Description: Lightweight SSH Client"; \
            echo " A modern, lightweight SSH client built with Wails."; \
            echo " Quickly manage and connect to your SSH servers."; \
          } > build/deb/DEBIAN/control
          cp build/bin/Lumin build/deb/usr/bin/lumin
          sudo chown root:root build/deb/usr/bin/lumin
          cp build/appicon.png build/deb/usr/share/icons/hicolor/256x256/apps/lumin.png
          cp build/linux/lumin.desktop build/deb/usr/share/applications/lumin.desktop
          sudo dpkg-deb --root-owner-group --build build/deb "build/Lumin-V${VERSION}-amd64.deb"
          shasum -a 256 "build/Lumin-V${VERSION}-amd64.deb" | sed 's|build/||' > "build/Lumin-V${VERSION}-amd64.deb.sha256"
          echo "deb=${{ github.workspace }}/build/Lumin-V${VERSION}-amd64.deb" >> $GITHUB_ENV
          echo "deb_sha=${{ github.workspace }}/build/Lumin-V${VERSION}-amd64.deb.sha256" >> $GITHUB_ENV
          # Convert .deb to .rpm via alien
          sudo alien -r "build/Lumin-V${VERSION}-amd64.deb" --scripts || echo "alien_rpm_failed=true" >> $GITHUB_ENV
          RPM_FILE=$(find . -name "*.rpm" 2>/dev/null | head -1)
          if [ -n "$RPM_FILE" ]; then
            mv "$RPM_FILE" build/
            RPM_BASENAME=$(basename "$RPM_FILE")
            # 统一命名：加入 V 前缀，x86_64 → amd64，去掉 alien release 号
            RPM_BASENAME_CLEAN=$(echo "$RPM_BASENAME" | sed "s/lumin-[0-9.]\+-\([0-9]\+\)\.x86_64\.rpm/Lumin-V${VERSION}-amd64.rpm/")
            if [ "$RPM_BASENAME" != "$RPM_BASENAME_CLEAN" ] && [ -f "build/$RPM_BASENAME" ]; then
              mv "build/$RPM_BASENAME" "build/$RPM_BASENAME_CLEAN"
              RPM_BASENAME="$RPM_BASENAME_CLEAN"
            fi
            shasum -a 256 "build/$RPM_BASENAME" | sed 's|build/||' > "build/$RPM_BASENAME.sha256"
            echo "rpm=${{ github.workspace }}/build/$RPM_BASENAME" >> $GITHUB_ENV
            echo "rpm_sha=${{ github.workspace }}/build/$RPM_BASENAME.sha256" >> $GITHUB_ENV
          fi

      # 只上传产物，不经 softprops，避免覆盖 name/body
      - name: Upload to Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=("${binary}" "${binary_sha}" "${deb}" "${deb_sha}")
          if [ -n "${rpm:-}" ] && [ -f "${rpm}" ]; then
            files+=("${rpm}" "${rpm_sha}")
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --clobber \
            "${files[@]}"

  build-macos:
    needs: create-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build Wails
        run: |
          export PATH=$HOME/go/bin:$PATH
          wails build -clean -o Lumin
          uname -m
          file build/bin/Lumin.app/Contents/MacOS/Lumin
          lipo -archs build/bin/Lumin.app/Contents/MacOS/Lumin

      - name: Package .app to .dmg
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ARCH=${{ matrix.arch }}
          cp -r build/bin/Lumin.app build/Lumin.app
          hdiutil create -volname "Lumin" -srcfolder build/Lumin.app -ov -format UDZO "build/Lumin-V${VERSION}-${ARCH}.dmg"
          shasum -a 256 "build/Lumin-V${VERSION}-${ARCH}.dmg" | sed 's|build/||' > "build/Lumin-V${VERSION}-${ARCH}.dmg.sha256"
          echo "app_dmg=${{ github.workspace }}/build/Lumin-V${VERSION}-${ARCH}.dmg" >> $GITHUB_ENV
          echo "app_sha=${{ github.workspace }}/build/Lumin-V${VERSION}-${ARCH}.dmg.sha256" >> $GITHUB_ENV

      - name: Upload to Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --clobber \
            "${app_dmg}" "${app_sha}"

  build-windows:
    needs: create-draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build Wails (binary + NSIS installer)
        run: |
          $env:PATH = "$env:USERPROFILE\go\bin;C:\Program Files (x86)\NSIS;" + $env:PATH
          wails build -clean -o Lumin.exe --nsis

      - name: Package portable
        shell: pwsh
        run: |
          $VERSION = "$env:GITHUB_REF_NAME" -replace "^v", ""
          Copy-Item build/bin/Lumin.exe "build/Lumin-V$VERSION-portable.exe"
          $hash = (CertUtil -hashfile "build/Lumin-V$VERSION-portable.exe" SHA256)[1] -replace " ",""
          Set-Content -Path "build/Lumin-V$VERSION-portable.exe.sha256" -Value "$hash  Lumin-V$VERSION-portable.exe"
          echo "portable=${{ github.workspace }}\build\Lumin-V$VERSION-portable.exe" >> $env:GITHUB_ENV
          echo "portable_sha=${{ github.workspace }}\build\Lumin-V$VERSION-portable.exe.sha256" >> $env:GITHUB_ENV

      - name: Copy NSIS installer
        shell: pwsh
        run: |
          $VERSION = "$env:GITHUB_REF_NAME" -replace "^v", ""
          $installer = Get-Item "build/bin/*-installer.exe"
          Copy-Item $installer.FullName "build/Lumin-V$VERSION-amd64-installer.exe"
          $hash = (CertUtil -hashfile "build/Lumin-V$VERSION-amd64-installer.exe" SHA256)[1] -replace " ",""
          Set-Content -Path "build/Lumin-V$VERSION-amd64-installer.exe.sha256" -Value "$hash  Lumin-V$VERSION-amd64-installer.exe"
          echo "installer=${{ github.workspace }}\build\Lumin-V$VERSION-amd64-installer.exe" >> $env:GITHUB_ENV
          echo "installer_sha=${{ github.workspace }}\build\Lumin-V$VERSION-amd64-installer.exe.sha256" >> $env:GITHUB_ENV

      - name: Upload to Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --clobber \
            "${portable}" "${portable_sha}" "${installer}" "${installer_sha}"

  # 全平台产物齐套后再取消 draft，客户端 /releases/latest 才能看到
  # 用 gh release edit 只改 draft/latest，避免覆盖 name/body
  publish-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest
